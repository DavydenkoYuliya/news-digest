name: AI Дайджест новин

on:
  schedule:
    # Пн–Пт о 22:00 UTC = 01:00 за Києвом влітку, 00:00 взимку. GitHub може стартувати із затримкою
    # до кількох годин — користувачам обіцяємо оновлення «до початку робочого дня».
    - cron: '0 22 * * 0-4'
  workflow_dispatch:          # ручний запуск з GitHub

permissions:
  contents: write   # зберегти щоденні файли даних у репозиторії
  pages: write      # опублікувати сайт (GitHub Pages)
  id-token: write   # потрібен офіційній публікації GitHub Pages

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-4-5' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Встановити залежності
        run: |
          pip install -r requirements.txt
          if [ "$LLM_PROVIDER" != "anthropic" ]; then pip install "openai==2.54.0"; fi

      - name: Перевірки (без AI)
        run: python -m unittest discover tests

      - name: Нічний запуск
        run: python run.py

      - name: Зберегти дані в репозиторії
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A site/public/data site/public/competitor_brief.html
          git diff --cached --quiet || git commit -m "Дані $(date +%Y-%m-%d)"
          # якщо під час запуску хтось змінив налаштування в репозиторії — спершу підтягнути їх
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Зібрати сайт
        working-directory: site
        run: |
          npm ci
          npm run build

      # Публікація офіційними кроками GitHub. Settings → Pages → Source: «GitHub Actions».
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/build
      - id: deployment
        uses: actions/deploy-pages@v5
