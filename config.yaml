# Налаштування AI Дайджесту новин.
# Тут усе, що можна змінювати без програміста. Секрети (ключ AI) — лише у .env.

# ---------------------------------------------------------------- збір новин
collect:
  days: 3                     # за скільки діб збирати новини з RSS
  max_per_source: 100         # не більше N новин з одного джерела (0 = без ліміту)
  exclude_rss_categories: [sport, sports, opinion, comment, culture, entertainment, video, lifestyle]
  feeds_file: feeds/feeds.txt
  verify_ssl: true            # false — лише для корпоративного проксі, що підміняє сертифікати

# ---------------------------------------------------------------- AI-класифікація
classify:
  min_score: 3                # у дайджест потрапляють новини з оцінкою >= min_score (поріг підібрано під модель claude-haiku-5-5)
  pass1_threshold: 3          # оцінка за заголовком >= N → детальний розбір (2-й етап)
  pass1_batch_size: 50
  pass2_batch_size: 16
  blocked_title_prefixes: ["morning bid:", "evening bid:", "reuters morning bid"]
  irrelevant_keywords: [nba, nfl, nhl, mlb, fifa, formula 1, premier league, oscar, grammy, emmy,
                        celebrity, kardashian, taylor swift, movie, film, television, tv show,
                        box office, recipe, cooking, diet, fitness, workout, horoscope, astrology, lottery]

# ---------------------------------------------------------------- довідники (методика)
# AI може відповідати лише значеннями з цих списків.
taxonomy:
  # Напрями: ключ (саме так відповідає AI) → назва на сайті та іконка в стрічці.
  # Новий напрям — один рядок. Іконки: logistics, prices, geo, trade, finance, regulatory,
  # weather, health, energy, strike, agro, other.
  domains:
    логістика:            {name: Логістика,                     icon: logistics}
    ціни_сировини:        {name: Ціни на сировину,              icon: prices}
    геополітика:          {name: Геополітика,                   icon: geo}
    санкції_торгівля:     {name: Санкції і торгівля,            icon: trade}
    валюта_фінанси:       {name: Валюта і фінанси,              icon: finance}
    митниця_регуляторика: {name: Митниця і регуляторика,        icon: regulatory}
    погода_клімат:        {name: Погода і клімат,               icon: weather}
    здоров'я_біобезпека:  {name: Здоров'я тварин і біобезпека,  icon: health}
    енергетика:           {name: Енергетика,                    icon: energy}
    страйки_перебої:      {name: Страйки і перебої,             icon: strike}
    не_релевантно:        {name: Не релевантно,                 icon: other}
  categories:
    - Незернові компоненти для комбікорму
    - Послуги
    - Енергоносії
    - ОЗ
    - Запчастини
    - Таропак. матеріали
    - Добавки та спеції
    - Добрива
    - ЗЗР
    - Ветпрепарати
    - Насіння
    - Вит.матеріали/МШП
    - Будівельні матеріали
    - Деззасоби/хім.продукція
    - Кулінарія
    - НМА
    - Покупні корми тваринництво
    - Спецодяг та ЗІЗ
    - Лабораторії
    - Рукава зернові
    - Всі категорії

# ---------------------------------------------------------------- прибирання повторів
dedup:
  previous_days_to_check: 2   # з якими попередніми днями порівнювати (наявні файли)
  lookback_calendar_days: 4   # як далеко шукати ці файли (вихідні без запусків)
  keep_full_days: 7           # скільки днів зберігати повні щоденні файли; старші видаляються

# ---------------------------------------------------------------- конкуренти
# Які компанії стежимо, як їх упізнавати, профілі для брифінгу — у competitors.yaml.
competitors:
  enabled: true
  days: 3

# ---------------------------------------------------------------- брифінг по категоріях (AI-аналітика)
category_briefs:
  enabled: true
  min_news: 5                 # довідка створюється, лише якщо новин >= min_news; інакше «недостатньо даних»
  max_news_per_brief: 40      # скільки новин передавати AI в одну довідку
  profiles:                   # «Профіль категорії» — заповнюється вручну один раз
    "Незернові компоненти для комбікорму":
      "Що входить": "Соєвий і соняшниковий шрот, амінокислоти (лізин, метіонін, треонін), премікси, вітаміни, ферменти, сорбенти, кормові добавки"
      "За чим стежимо": "Ціни на соєвий шрот (США, Аргентина, Бразилія, Китай), торгівля США–Китай, погода в регіонах вирощування сої"
    "Добрива":
      "Що входить": "Аміак, сечовина (карбамід), калійні та фосфатні добрива (MOP, DAP), NPK, азотні добрива"
      "За чим стежимо": "Ціни на газ (сировина для аміаку), експортні обмеження основних виробників, санкції, логістика"

# ---------------------------------------------------------------- «Головне сьогодні»
today:
  procurement_items: 4        # скільки головних подій по закупівлях показувати

# ---------------------------------------------------------------- AI (модель і ліміти; провайдер і ключ — у .env)
llm:
  timeout_seconds: 180
  pause_between_calls: 0.3
  effort: low                 # глибина роздумів моделі: low | medium | high; "" — не задавати.
                              # Лише для моделей, що «думають» перед відповіддю (Claude Haiku 5.5 і новіші);
                              # для claude-haiku-4-5 залишати порожнім.

# ---------------------------------------------------------------- публікація
publish:
  site_data_dir: site/public/data     # куди нічний запуск кладе файли для сайту
  competitor_brief_file: site/public/competitor_brief.html
